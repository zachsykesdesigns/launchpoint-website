<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AirFeet — TV Backdrop</title>
<!-- TV backdrop (Zach 2026-11-19): NO videos. QR header on top, smaller rotating
     hero banner (desktop ads) centered underneath, full 16:9 navy frame. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; cursor:pointer;
    background:linear-gradient(180deg, #0A3460 0%, #062A4E 45%, #03182E 100%);
    font-family:'Arial Black', 'Segoe UI', Arial, sans-serif; }
  #hdr { position:absolute; top:0; left:0; right:0; height:31vh; z-index:5;
    display:flex; align-items:center; justify-content:space-between; padding:1.4vh 2.2vw; }
  #hdr .qr { height:100%; border-radius:1.2vh; box-shadow:0 4px 24px rgba(0,0,0,.45); }
  #hdr .logo { height:88%; filter:drop-shadow(0 3px 14px rgba(0,0,0,.7)); }
  #main { position:absolute; left:0; right:0; top:33.5vh; bottom:2vh; display:flex; gap:1.6vw; padding:0 1.6vw; }
  .side { flex:0 0 20%; display:flex; align-items:center; justify-content:center; }
  .side video { width:100%; height:100%; object-fit:contain; border-radius:1.2vh; box-shadow:0 4px 24px rgba(0,0,0,.45); }
  #hero { position:relative; flex:1; height:100%;
    overflow:visible; background:transparent; }
  #hero img, #hero video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity .8s ease; }
  #hero img.active, #hero video.active { opacity:1; }
</style>
</head>
<body>

<div id="hdr">
  <img class="qr" src="qr-card-deal-christmas.png" alt="Scan for the Holiday Mart deal — $20 off">
  <img class="logo" src="https://cdn.shopify.com/s/files/1/0725/7866/2582/files/tailgate-airfeet-logo.png?v=1794584871" alt="AIRfeet Recovery">
  <img class="qr" src="qr-card-shop.png" alt="Scan to shop">
</div>

<div id="main">
  <div class="side"><video src="airfeet-thongs-video-christmas-v1.mp4" autoplay muted loop playsinline onloadedmetadata="this.playbackRate=0.55"></video></div>
  <div id="hero"></div>
  <div class="side"><video src="airfeet-slides-video-christmas-v1.mp4" autoplay muted loop playsinline onloadedmetadata="this.playbackRate=0.55"></video></div>
</div>



<script>


const PLAYLIST = [
 {t:'v', s:'airfeet-smokey-zachcut-smoke-v7-web.mp4'},
 {t:'i', s:'https://cdn.shopify.com/s/files/1/0725/7866/2582/files/indiana-collection-hero-poster-v5.jpg?v=1794608291'},
 {t:'v', s:'https://cdn.shopify.com/videos/c/vp/b6d7463ce8164abbb8cf0bad4e2f3b40/b6d7463ce8164abbb8cf0bad4e2f3b40.HD-720p-1.6Mbps-102152629.mp4'},
 {t:'i', s:'christmas-santa-mobile.png'},
 {t:'v', s:'bama-elephant-tales-v4-web.mp4'},
 {t:'v', s:'https://cdn.shopify.com/videos/c/vp/bbcfc17b0c4343039f15c4ca01e6c135/bbcfc17b0c4343039f15c4ca01e6c135.HD-720p-1.6Mbps-102152682.mp4'},
 {t:'i', s:'hoops-opener-mobile.png'},
 {t:'i', s:'https://cdn.shopify.com/s/files/1/0725/7866/2582/files/alabama-collection-hero-poster-v6.jpg?v=1794603251'},
 {t:'v', s:'https://cdn.shopify.com/videos/c/vp/492047d90e1f441d8023863cf5d19cb3/492047d90e1f441d8023863cf5d19cb3.HD-720p-1.6Mbps-102152728.mp4'},
 {t:'i', s:'rivalry-week-mobile.png'},
 {t:'v', s:'bison-reindeer-tales-v1-web.mp4'},
 {t:'v', s:'https://cdn.shopify.com/videos/c/vp/42485e55b64c4c389d7ef7a284e63755/42485e55b64c4c389d7ef7a284e63755.HD-720p-1.6Mbps-102152761.mp4'},
 {t:'i', s:'holiday-mart-mobile.png'},
 {t:'v', s:'https://cdn.shopify.com/videos/c/vp/3a61ccf0c5e14d03b1bc134ff4662f87/3a61ccf0c5e14d03b1bc134ff4662f87.HD-720p-1.6Mbps-102152807.mp4'},
 {t:'i', s:'indiana-usc-mobile.png'},
 {t:'v', s:'https://cdn.shopify.com/videos/c/vp/ab4ffa7efdb94933beb2b23ed542a4fe/ab4ffa7efdb94933beb2b23ed542a4fe.HD-720p-1.6Mbps-102152828.mp4'},
 {t:'i', s:'alabama-vanderbilt-mobile.png'},
 {t:'v', s:'https://cdn.shopify.com/videos/c/vp/0cf1558770d24881a47d78db8222ab21/0cf1558770d24881a47d78db8222ab21.HD-720p-1.6Mbps-102152856.mp4'},
 {t:'i', s:'bowl-season-mobile.png'},
 {t:'v', s:'https://cdn.shopify.com/videos/c/vp/617ef903aac14187ab80a2edab959928/617ef903aac14187ab80a2edab959928.HD-720p-1.6Mbps-102152867.mp4'},
 {t:'i', s:'https://cdn.shopify.com/s/files/1/0725/7866/2582/files/purdue-collection-hero-poster.png?v=1794581253'},
 {t:'i', s:'new-year-mobile.png'},
 {t:'i', s:'mascots-group-v4.jpg'}
];
const hero = document.getElementById('hero');
let curIdx = -1, timer = null, soundOn = false;
function next() { playItem((curIdx + 1) % PLAYLIST.length); }
function swapIn(el, item) {
  const old = hero.querySelector('.active');
  el.classList.add('active');
  hero.appendChild(el);
  if (old) setTimeout(() => old.remove(), 800);
  clearTimeout(timer);
  if (item.t === 'i') {
    timer = setTimeout(next, 6000);
  } else {
    el.muted = !soundOn;
    el.play().catch(() => { el.muted = true; el.play().catch(() => {}); });
    el.onended = next;
    timer = setTimeout(next, 60000);
  }
}
function playItem(idx) {
  curIdx = idx;
  const item = PLAYLIST[idx];
  if (item.t === 'i') {
    const im = new Image();
    im.alt = '';
    im.onload = () => swapIn(im, item);
    im.onerror = () => next();
    im.src = item.s;
  } else {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.autoplay = true; v.preload = 'auto';
    if (item.s === 'airfeet-slides-video-christmas-v1.mp4') v.playbackRate = 0.7;
    let swapped = false;
    v.oncanplay = () => { swapped = true; swapIn(v, item); };
    v.onerror = () => next();
    v.src = item.s;
    setTimeout(() => { if (!swapped && curIdx === idx) next(); }, 12000);
  }
}
playItem(0);



async function goFull() {
  try { await document.documentElement.requestFullscreen(); } catch(e) {}
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e) {}
}
document.addEventListener('click', goFull);
function enableSound() {
  soundOn = true;
  const v = hero.querySelector('video.active');
  if (v) { v.muted = false; v.play().catch(() => {}); }
}
document.addEventListener('click', enableSound);
document.addEventListener('keydown', enableSound);
</script>
</body>
</html>
