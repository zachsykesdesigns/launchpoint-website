<style>

    font-family:'Arial Black', 'Segoe UI', Arial, sans-serif; }
  #hdr { position:absolute; top:0; left:0; right:0; height:31vh; z-index:5;
    display:flex; align-items:center; justify-content:space-between; padding:1.4vh 2.2vw; }
  #hdr .qr { height:100%; border-radius:1.2vh; box-shadow:0 4px 24px rgba(0,0,0,.45); }
  #hdr .logo { height:88%; filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(2px 2px 0 #000) drop-shadow(-2px 2px 0 #000) drop-shadow(2px -2px 0 #000) drop-shadow(-2px -2px 0 #000) drop-shadow(0 3px 14px rgba(0,0,0,.7)); }
  #main { position:absolute; left:0; right:0; top:33.5vh; bottom:2vh; display:flex; gap:1.6vw; padding:0 1.6vw; }
  .side { flex:0 0 16%; overflow:hidden; border-radius:1.2vh; }
  .rail-track { display:flex; flex-direction:column; gap:1.4vh; animation:railscroll 160s linear infinite; will-change:transform; }
  .rail-track img { width:100%; display:block; border-radius:1.2vh; box-shadow:0 4px 24px rgba(0,0,0,.45); }
  @keyframes railscroll { from { transform:translateY(0); } to { transform:translateY(-50%); } }
  .side video { width:100%; height:100%; object-fit:contain; border-radius:1.2vh; box-shadow:0 4px 24px rgba(0,0,0,.45); }
  #hero { position:relative; flex:1; height:100%;
    overflow:visible; background:transparent; }
  #hero img, #hero video { position:absolute; left:5%; top:5%; width:90%; height:90%; object-fit:contain;
    opacity:0; transition:opacity .8s ease; }
  #hero img.active, #hero video.active { opacity:1; }
  #fsBtn { position:absolute; right:1.2vw; bottom:1.2vh; z-index:20; background:rgba(0,0,0,.55);
    color:#fff; border:2px solid rgba(255,255,255,.7); border-radius:1vh; padding:1.2vh 1.6vw;

var heroImg = document.getElementById('heroImg');
var heroVid = document.getElementById('heroVid');
var curIdx = 0;
var timer = null;
var soundOn = false;
var lastTime = -1;
var stuckSecs = 0;
var preNext = null;

function tryPlay(v) {
  try {
    var p = v.play();
    if (p && p.catch) { p.catch(function () { v.muted = true; try { v.play(); } catch (e) {} }); }
  } catch (e) {}
}
function preloadNext() {
  var n = PLAYLIST[(curIdx + 1) % PLAYLIST.length];
  if (!n) { return; }
  if (n.t === 'i') { preNext = new Image(); preNext.src = n.s; }
  else { preNext = document.createElement('video'); preNext.muted = true; preNext.preload = 'auto'; preNext.src = n.s; }
}
function show(idx) {
  curIdx = idx;
  var item = PLAYLIST[idx];
  if (timer) { clearTimeout(timer); timer = null; }
  stuckSecs = 0; lastTime = -1;
  if (item.t === 'i') {
    try { heroVid.pause(); } catch (e) {}
    heroVid.className = '';
    heroImg.src = item.s;
    heroImg.className = 'active';
    timer = setTimeout(nextItem, 8000);
  } else {
    heroImg.className = '';
    heroVid.src = item.s;
    if (item.s === 'airfeet-slides-video-christmas-v1.mp4') { try { heroVid.playbackRate = 0.7; } catch (e) {} }
    else { try { heroVid.playbackRate = 1; } catch (e) {} }
    heroVid.muted = !soundOn;
    heroVid.className = 'active';
    tryPlay(heroVid);
    timer = setTimeout(nextItem, 45000);
  }
  preloadNext();
}
function nextItem() { show((curIdx + 1) % PLAYLIST.length); }
heroVid.addEventListener('ended', function () { nextItem(); });
heroVid.addEventListener('error', function () { if (heroVid.className === 'active') { nextItem(); } }, true);
heroVid.addEventListener('loadedmetadata', function () {
  if (heroVid.className === 'active' && heroVid.duration && isFinite(heroVid.duration)) {
    if (timer) { clearTimeout(timer); }
    timer = setTimeout(nextItem, (heroVid.duration + 8) * 1000);
  }
});
setInterval(function () {
  if (heroVid.className !== 'active') { stuckSecs = 0; lastTime = -1; return; }
  if (heroVid.ended) { return; }
  if (heroVid.readyState < 3 || heroVid.currentTime === lastTime) {
    stuckSecs += 2;
    if (stuckSecs >= 8) { nextItem(); }
  } else { stuckSecs = 0; lastTime = heroVid.currentTime; }
}, 2000);
function goFull() {
  try {
    var el = document.documentElement;
    if (el.requestFullscreen) { el.requestFullscreen(); }
    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
    else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
  } catch (e) {}
  try { if (navigator.wakeLock && navigator.wakeLock.request) { navigator.wakeLock.request('screen'); } } catch (e) {}
}
function enableSound() {
  soundOn = true;
  if (heroVid.className === 'active') { heroVid.muted = false; tryPlay(heroVid); }
}
document.addEventListener('click', function () { goFull(); enableSound(); });
document.addEventListener('keydown', function () { enableSound(); });
show(0);
