<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AirFeet — Tailgate Loop</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#000; overflow:hidden; cursor:pointer;
    font-family:'Arial Black', 'Segoe UI', Arial, sans-serif; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity .7s ease; pointer-events:none; }
  .slide.active { opacity:1; }
  .slide video, .slide img.media { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .slide img.media.cover { object-fit:cover; }
  .caption { position:absolute; left:0; right:0; bottom:5.5vh; text-align:center; z-index:5;
    color:#fff; text-transform:uppercase; letter-spacing:.14em;
    font-size:clamp(18px, 2.7vw, 44px); font-weight:900; line-height:1.15;
    text-shadow:0 3px 18px rgba(0,0,0,.85), 0 0 4px rgba(0,0,0,.9); padding:0 4vw; }
  .caption .accent { color:#71D53C; }
  .caption .sub { display:block; margin-top:1.2vh; font-size:clamp(12px, 1.4vw, 24px);
    letter-spacing:.22em; font-weight:700; color:#F4F1EA; }
  #logo { position:absolute; right:2.2vw; bottom:2.4vh; width:clamp(120px, 13vw, 260px); z-index:6;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.8)); opacity:.95; }
  #hint { position:absolute; left:0; right:0; top:4vh; text-align:center; z-index:7; color:#fff;
    font-size:clamp(14px, 1.6vw, 26px); letter-spacing:.22em; text-transform:uppercase;
    text-shadow:0 2px 12px rgba(0,0,0,.9); transition:opacity 1s ease; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  #hint.gone { opacity:0 !important; animation:none; }
</style>
</head>
<body>

<div id="hint">Tap anywhere for full screen</div>
<img id="logo" src="https://cdn.shopify.com/s/files/1/0725/7866/2582/files/tailgate-airfeet-logo.png?v=1794584871" alt="AIRfeet Recovery">

<div id="stage"></div>

<script>
const CDN = 'https://cdn.shopify.com/s/files/1/0725/7866/2582/files/';
const slides = [
  { type:'video', src: CDN+'tailgate-iu-usc-video-1080-v3.mp4?v=1794590703',
    cap:'Hollywood Comes to <span class="accent">Bloomington.</span>', sub:'Trojans vs Hoosiers — Saturday 3:30 PM · CBS' },
  { type:'video', src: CDN+'indiana-collection-hero-video-v4.mp4?v=1794581816',
    cap:'Indiana <span class="accent">— Recover Fast.</span>', sub:'Made by Tyrol — Active Recovery' },
  { type:'img', src: CDN+'tailgate-holiday-santa-iu-v3.png?v=1794588682', cover:true, cap:'', sub:'' },
  { type:'video', src: CDN+'hero-video-tennessee.mp4?v=1794577291',
    cap:'Recover Fast. <span class="accent">Built for Athletes.</span>', sub:'Made by Tyrol — Active Recovery' },
  { type:'img', src: CDN+'tailgate-holiday-nurse-v3.png?v=1794588682', cover:true, cap:'', sub:'' },
  { type:'video', src: CDN+'tailgate-lineup-fullscreen.mp4?v=1794590549',
    cap:'We Support <span class="accent">Champions.</span>', sub:'18 Schools — Slides + Thongs' },
  { type:'img', src: CDN+'tailgate-purdue-plus-v2.jpg?v=1794590549',
    cap:'Recovery in <span class="accent">Every Layer.</span>', sub:'Layered Tyrol Cushioning' },
  { type:'video', src: CDN+'hero-video-tyrol-pickleball.mp4?v=1794579871',
    cap:'Play in Tyrol. <span class="accent">Recover in AirFeet.</span>', sub:'On Court — Off Court' },
  { type:'img', src: CDN+'tailgate-holiday-boots-v3.png?v=1794588682', cover:true, cap:'', sub:'' },
  { type:'video', src: CDN+'alabama-collection-hero-video.mp4?v=1794580943',
    cap:'Alabama <span class="accent">— Feel the Difference.</span>', sub:'AIRfeet Recovery by Tyrol' },
  { type:'img', src: CDN+'hero-skeleton-purdue-desktop-v2.jpg?v=1794531006',
    cap:'Recovery, <span class="accent">Down to the Bone.</span>', sub:'Made by Tyrol — Active Recovery' },
  { type:'video', src: CDN+'tailgate-hero-banner-video-v2.mp4?v=1794590549',
    cap:'It\u2019s Like <span class="accent">Walking on Air.</span>', sub:'AIRfeet Recovery by Tyrol' },
  { type:'video', src: CDN+'kansas-collection-hero-video.mp4?v=1794581254',
    cap:'Kansas <span class="accent">— Feel the Difference.</span>', sub:'AIRfeet Recovery by Tyrol' },
  { type:'img', src: CDN+'tailgate-holiday-give-team-v3.png?v=1794588682', cover:true, cap:'', sub:'' },
  { type:'img', src: CDN+'tailgate-nurse-plus-v2.jpg?v=1794590549',
    cap:'Come Home <span class="accent">to Recovery.</span>', sub:'For Those Long Shifts' },
  { type:'video', src: CDN+'clemson-collection-hero-video.mp4?v=1794581253',
    cap:'Clemson <span class="accent">— Feel the Difference.</span>', sub:'AIRfeet Recovery by Tyrol' },
  { type:'video', src: CDN+'florida-collection-hero-video.mp4?v=1794581253',
    cap:'Florida <span class="accent">— Feel the Difference.</span>', sub:'AIRfeet Recovery by Tyrol' },
  { type:'img', src: CDN+'tailgate-holiday-black-friday-v3.png?v=1794588682', cover:true, cap:'', sub:'' },
  { type:'img', src: CDN+'hero-workday-alabama-desktop.jpg?v=1794530290',
    cap:'Work Day Done. <span class="accent">Recover Right.</span>', sub:'Made by Tyrol — Active Recovery' },
  { type:'video', src: CDN+'lsu-collection-hero-video.mp4?v=1794581253',
    cap:'LSU <span class="accent">— Feel the Difference.</span>', sub:'AIRfeet Recovery by Tyrol' },
  { type:'video', src: CDN+'purdue-collection-hero-video.mp4?v=1794581253',
    cap:'Purdue <span class="accent">— Feel the Difference.</span>', sub:'AIRfeet Recovery by Tyrol' },
  { type:'video', src: CDN+'ims-collection-hero-video-v3.mp4?v=1794585693',
    cap:'Indianapolis Motor Speedway <span class="accent">— Feel the Difference.</span>', sub:'AIRfeet Recovery by Tyrol' },
];

const stage = document.getElementById('stage');
const els = slides.map(s => {
  const d = document.createElement('div');
  d.className = 'slide';
  if (s.type === 'video') {
    const v = document.createElement('video');
    v.src = s.src; v.muted = true; v.loop = false; v.playsInline = true;
    v.setAttribute('playsinline',''); v.preload = 'auto';
    d.appendChild(v); d._media = v;
  } else {
    const im = document.createElement('img');
    im.src = s.src; im.className = 'media' + (s.cover ? ' cover' : '');
    im.alt = ''; d.appendChild(im); d._media = im;
  }
  const c = document.createElement('div');
  c.className = 'caption';
  c.innerHTML = s.cap + (s.sub ? '<span class="sub">'+s.sub+'</span>' : '');
  d.appendChild(c);
  stage.appendChild(d);
  return d;
});

let idx = -1, timer = null;
function show(n) {
  if (idx >= 0) {
    const prev = els[idx];
    prev.classList.remove('active');
    if (slides[idx].type === 'video') { prev._media.pause(); }
  }
  idx = ((n % slides.length) + slides.length) % slides.length;
  const cur = els[idx];
  cur.classList.add('active');
  clearTimeout(timer);
  if (slides[idx].type === 'video') {
    const v = cur._media;
    v.currentTime = 0;
    const p = v.play(); if (p) p.catch(()=>{});
    v.onended = () => show(idx + 1);
    timer = setTimeout(() => show(idx + 1), 45000); /* safety if a video stalls */
  } else {
    timer = setTimeout(() => show(idx + 1), 8000);
  }
}
show(0);

async function goFull() {
  const hint = document.getElementById('hint');
  hint.classList.add('gone');
  try { await document.documentElement.requestFullscreen(); } catch(e) {}
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e) {}
}
document.addEventListener('click', goFull);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') show(idx + 1);
  if (e.key === 'ArrowLeft') show(idx - 1);
  if (e.key.toLowerCase() === 'f') goFull();
});
</script>
</body>
</html>
