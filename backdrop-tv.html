<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AirFeet — TV Backdrop</title>
<!-- TV backdrop v2 clean URL (Zach 2026-11-19): NO videos. QR header on top, smaller rotating
     hero banner (desktop ads) centered underneath, full 16:9 navy frame. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; cursor:pointer;
    background:linear-gradient(180deg, #0A3460 0%, #062A4E 45%, #03182E 100%);
    font-family:'Arial Black', 'Segoe UI', Arial, sans-serif; }
  #hdr { position:absolute; top:0; left:0; right:0; height:21vh; z-index:5;
    display:flex; align-items:center; justify-content:space-between; padding:1.4vh 2.2vw; }
  #hdr .qr { height:100%; border-radius:1.2vh; box-shadow:0 4px 24px rgba(0,0,0,.45); }
  #hdr .logo { height:88%; filter:drop-shadow(0 3px 14px rgba(0,0,0,.7)); }
  #hero { position:absolute; left:50%; transform:translateX(-50%); top:23.5vh; width:min(94vw, 122vh); height:56vh;
    overflow:visible; background:transparent; }
  #hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity .8s ease; }
  #hero img.active { opacity:1; }
    text-shadow:0 3px 14px rgba(0,0,0,.8); }
</style>
</head>
<body>

<div id="hdr">
  <img class="qr" src="qr-card-deal.png" alt="Scan for the Holiday Mart deal">
  <img class="logo" src="https://cdn.shopify.com/s/files/1/0725/7866/2582/files/tailgate-airfeet-logo.png?v=1794584871" alt="AIRfeet Recovery">
  <img class="qr" src="qr-card-shop.png" alt="Scan to shop">
</div>

<div id="hero"></div>



<script>


const SRCS = ['holiday-mart-mobile.png','mascots-group-v2.jpg','christmas-santa-mobile.png',
'01-santa-hoodie-gift-v4.jpg','hoops-opener-mobile.png','02-holiday-nurse-gift-v7.jpg',
'rivalry-week-mobile.png','05-skeleton-purdue-gift-v6.jpg','indiana-usc-mobile.png',
'06-give-team-gift-v7.jpg','alabama-vanderbilt-mobile.png','07-nurse-plus-gift-v5.jpg',
'thanksgiving-mobile.png','09-workday-alabama-gift-v6.jpg','10-santa-two-gift-v8.jpg',
'04-boots-gift-v13.jpg','03-purdue-tech-gift-v5.jpg'];
const hero = document.getElementById('hero');
const layers = [document.createElement('img'), document.createElement('img')];
layers.forEach(im => { im.alt = ''; hero.appendChild(im); });
let ready = [], cur = -1, front = 0;
SRCS.forEach(src => {
  const probe = new Image();
  probe.onload = () => { ready.push(src); if (cur === -1) show(0); };
  probe.src = src;
});
function show(i) {
  cur = i;
  const back = layers[1 - front];
  back.src = ready[i];
  back.classList.add('active');
  layers[front].classList.remove('active');
  front = 1 - front;
}
setInterval(() => { if (ready.length > 1) show((cur + 1) % ready.length); }, 6000);


async function goFull() {
  try { await document.documentElement.requestFullscreen(); } catch(e) {}
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e) {}
}
document.addEventListener('click', goFull);
</script>
</body>
</html>
